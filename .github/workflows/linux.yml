name: Linux

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and test Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev ca-certificates ripgrep
          rustup toolchain install 1.90.0 --profile minimal --no-self-update
          rustc +1.90.0 --version
          cargo +1.90.0 --version

      - name: Build with the minimum supported Rust version
        run: cargo +1.90.0 build --release --locked

      - name: Package and verify the executable
        run: |
          mkdir -p .work/unpacked
          tar -czf .work/sgrep-linux-x86_64.tar.gz -C target/release sgrep -C "$GITHUB_WORKSPACE" LICENSE
          cd .work
          sha256sum sgrep-linux-x86_64.tar.gz > sgrep-linux-x86_64.tar.gz.sha256
          sha256sum --check sgrep-linux-x86_64.tar.gz.sha256
          tar -xzf sgrep-linux-x86_64.tar.gz -C unpacked

      - name: Test the packaged executable with real models
        run: bash tests/linux.sh "$PWD/.work/unpacked/sgrep" .work/linux

      - name: Upload the Linux package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64
          path: |
            .work/sgrep-linux-x86_64.tar.gz
            .work/sgrep-linux-x86_64.tar.gz.sha256
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload test receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-test-results
          path: |
            .work/linux/*-results.json
            .work/linux/*-first-run.json
            .work/linux/platform.txt
          include-hidden-files: true
          if-no-files-found: ignore

  publish:
    name: Attach Linux assets to the release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64
          path: .work/dist

      - name: Upload the archive and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" .work/dist/* --repo "$GITHUB_REPOSITORY"
