[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sgrep"
version = "0.1.0"
description = "Ripgrep + static code embeddings. No index."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["model2vec==0.9.0", "huggingface-hub>=0.26,<2", "numpy>=1.26,<3"]

[project.scripts]
sgrep = "sgrep:main"

[tool.setuptools]
py-modules = ["sgrep"]
