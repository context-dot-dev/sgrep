[package]
name = "sgrep"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Ripgrep + static code embeddings. No index."

[dependencies]
clap = { version = "4", features = ["derive"] }
half = "2"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
regex = "1"
rayon = "1"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
tree-sitter = "0.25.10"
tree-sitter-python = "0.25.0"

[profile.release]
lto = "thin"
